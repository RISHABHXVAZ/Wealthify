# System Deployment Profile
spring.profiles.active=prod

# Server Config
server.port=8080

# Database Configuration (Neon Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security Tokens (JWT)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# Metadata
spring.application.name=Wealthify

# Groq AI Integrations
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.api.key=${GROQ_API_KEY}

# Cross-Origin Target Routing
app.frontend.url=${APP_FRONTEND_URL}

# Native Spring Mail Configuration (Gmail SMTP Placeholders)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true