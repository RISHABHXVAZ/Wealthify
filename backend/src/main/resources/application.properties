# System Deployment Profile
spring.profiles.active=prod

# Server Config
server.port=8080

# Database Configuration (Neon Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security Tokens (JWT)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# Metadata
spring.application.name=Wealthify

# Groq AI Integrations
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile
groq.api.key=${GROQ_API_KEY}

# Cross-Origin Target Routing
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Production Resend API Configuration (Replaces legacy SMTP)
resend.api.key=${RESEND_API_KEY}