# System Deployment Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Server Config
server.port=8080

# Database Configuration (Neon Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations (Production Defaults - DEP-03)
# In production, Hibernate must never automatically mutate the schema.
# 'validate' verifies that the database schema matches entity definitions without modifying tables.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# Security Tokens (JWT)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000

# Metadata
spring.application.name=Wealthify

# Always surface a real error message in JSON responses (paired with
# GlobalExceptionHandler) instead of Spring Boot's default silent "never",
# which was making every backend error look like a generic connection
# failure on the frontend.
server.error.include-message=always
server.error.include-binding-errors=always

# Groq AI Integrations & Outbound HTTP Timeouts (RES-01)
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b
groq.api.key=${GROQ_API_KEY}
# Fail fast instead of hanging server threads indefinitely if Groq is slow/unresponsive
app.ai.http.connect-timeout-ms=${APP_AI_HTTP_CONNECT_TIMEOUT_MS:5000}
app.ai.http.read-timeout-ms=${APP_AI_HTTP_READ_TIMEOUT_MS:10000}

# AI In-Memory Cache Bounds (PERF-01)
app.ai.cache.max-capacity=${APP_AI_CACHE_MAX_CAPACITY:1000}
app.ai.cache.ttl-ms=${APP_AI_CACHE_TTL_MS:600000}

# Cross-Origin Target Routing
app.frontend.url=${APP_FRONTEND_URL:}

# Native Spring Mail Configuration (Gmail SMTP Placeholders)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast (10s) instead of hanging the whole HTTP request if Gmail SMTP is
# slow/unreachable (e.g. blocked or throttled outbound on the hosting
# platform) - an unbounded hang here can cause Render's proxy to kill the
# connection with a response that has no CORS headers at all, which looks
# like a CORS error in the browser even though it's really a timeout.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# OTP Rate Limiting & Abuse Prevention
app.security.otp.max-send-per-ip=3
app.security.otp.max-send-per-email=3
app.security.otp.send-window-seconds=600
app.security.otp.max-verify-attempts=5
app.security.otp.verify-lockout-seconds=900