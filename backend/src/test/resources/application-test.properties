# Test Profile Configuration (Isolated Testing)
# Prevents any inheritance from application-local.properties or remote cloud databases.

# Explicitly isolate the test database
spring.datasource.url=jdbc:postgresql://localhost:0/embedded_pg_placeholder
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema lifecycle: create tables cleanly for test runs and drop upon completion
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# In-memory test secrets and safe timeouts
app.jwt.secret=dGVzdF9qd3Rfc2VjcmV0X2tleV9mb3JfaXNvbGF0ZWRfdGVzdF9zdWl0ZV8xMjM0NTY3ODkwMTI=
app.jwt.expiration=3600000
app.frontend.url=http://localhost:5173

# Mock / disable external outbound calls during tests
groq.api.key=test_groq_api_key_for_unit_tests
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@wealthify.local
spring.mail.password=testpassword

# Actuator test exposure
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false

# Zonky Embedded Database provider configuration: force in-JVM native binary provider (ZONKY)
zonky.test.database.provider=zonky
